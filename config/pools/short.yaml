# 短线进攻池：A 股全市场 → 烂股剔除（pool_defaults）→ 板块权限 → 短线买点入池 / 卖点出池，上限 10 只。
# 当前规则为初始候选（REFACTOR_PLAN.md 第四节），以研发区事件研究与网格结果定稿；定稿前 enabled: false。
name: short
enabled: false
status: observe
universe: all
benchmark: SH000985        # 中证全指
strategy:
  name: signal_points
scorer:
  name: multifactor
  factors: {cmf20: 1.0, close_vwap: 1.0, amt_ratio5: -1.0}
filters:
  min_amount: {amount: 1.0e+8, window: 20}   # entry：近 20 日日均成交额 ≥ 1 亿
points:
  max_positions: 10
  buy:
    pullback_shrink: {amt: 0.7}
  avoid:
    falling_knife: {drop: -0.15}
  sell:
    below_ma: {n: 20}
  stop_loss: 0.05
  trailing_stop: 0.08
  max_hold: 10
  regime: {breadth_min: 0.3}
