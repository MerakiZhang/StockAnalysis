# 短线突破池（对照）：A 股全市场 → 烂股剔除 → 板块权限 → 放量突破买点入池、止损 / 跌破均线出池，上限 10 只。
# 用户 2026-10-16 要求保留"追涨突破"作为短线池之一。初步事件研究中放量突破 / MACD 金叉 / 均线多头 5~60 日超额
#   均为负，这里加强过滤（大盘在 60 日线上、不追高、质量门槛）后检验。
# 参数 2026-10-17 定稿：止损 5%、不设移动止盈、持有 10 天。研发区 24 个方案全部年化为负（最好 -3.1%），
#   作为对照池保留跟踪。
name: short_breakout
enabled: false
status: observe
universe: all
benchmark: SH000852        # 中证1000
strategy:
  name: signal_points
scorer:
  name: multifactor
  factors: {amt_ratio5: 1.0, ret20: 0.5, roe: 0.5}
filters:
  min_amount: {amount: 1.0e+8, window: 20}
points:
  max_positions: 10
  buy:
    breakout: {n: 20, amt: 1.5}
    quality_profit: {roe: 8}
  avoid:
    chase_high: {rise: 0.3}
    mfi_overbought: {level: 90}
  sell:
    below_ma: {n: 10}
  stop_loss: 0.05
  trailing_stop: null
  max_hold: 10
  regime: {index_ma60: true}
