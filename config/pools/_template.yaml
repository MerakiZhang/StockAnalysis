# 新股池模板：复制为 config/pools/<名称>.yaml（文件名即池名，_ 开头的文件不会被加载），
# 然后运行：python -X utf8 -m stockanalysis train --pool <名称>
# 未写的项继承 config/pool_defaults.yaml 与 config/global.yaml；可覆盖任意一项，例如：
name: example
enabled: true
status: observe
universe: csi800            # qlib 成分文件名（~/.qlib/qlib_data/cn_data/instruments/*.txt）
benchmark: SH000906
# sizing: {topk: 10}                       # 固定池容
# rebalance: {hold_thresh: 5}              # 只改该池的换仓规则
# filters:
#   boards: {boards: [main, cyb]}          # 放开创业板
#   exclude_st: false                      # 关闭某条默认规则
#   min_amount: {amount: 1.0e+8, window: 20}
