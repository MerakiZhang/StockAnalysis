# 所有股池共用的选股规则。改这里 = 改所有池；单个池在 config/pools/<name>.yaml 覆盖同名项。
# 规则来龙去脉与评估结果见 RULES.md。

# ---------- 优先分（池 yaml 覆盖；规则池用 multifactor）----------
scorer:
  name: random              # 占位：random / momentum 只用于冒烟或作为优先分对照

# ---------- 过滤规则 ----------
# exit = 持有规则（不通过即调出）；entry = 准入规则（只限制新买入）
# 单个池关闭某条：在池 yaml 写 filters: {规则名: false}；in_universe 不可关闭
filters:
  in_universe: {}                    # exit：当日在市（强制）
  # --- 烂股剔除（exit：各池共用，已持有的也强制卖出；口径见 features/risk.py）---
  not_st: {}                         # 历史 ST（baostock isST，缺数据时按涨跌停幅度近似）
  min_price: {price: 2.0}            # 不复权价 < 2 元（面值退市风险）
  min_market_cap: {cap: 3.0e+9}      # 总市值 < 30 亿
  no_consecutive_loss: {years: 2}    # 连续两年年报亏损
  positive_equity: {}                # 净资产为负
  revenue_floor: {revenue: 3.0e+8}   # 营收 < 3 亿且亏损
  no_risk_notice: {days: 365}        # 近一年立案调查 / 行政处罚 / 退市风险公告
  # --- 准入（entry：只限制新买入）---
  boards: {}                         # 板块权限，默认取 global.yaml 的 account_boards
  min_list_days: {days: 365}         # 上市满一年
  exclude_suspend: {days: 20}        # 近 20 日无停牌
  exclude_limit: {}                  # 当日未涨停
  no_release_ahead: {days: 20, ratio: 0.05}   # 未来约 20 个交易日解禁 ≤ 流通市值 5%
